<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hayelom Hailay Tsadik | Portfolio</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>
:root{
  --bg:#f9fafc;
  --text:#2E3A59;
  --card:#ffffff;
}
.dark-mode{
  --bg:#121212;
  --text:#f1f1f1;
  --card:#1e1e1e;
}
body{
  font-family:'Poppins',sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.3s;
}
nav{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.1);}
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(to right,#e3f2fd,#ffffff);
}
.hero img{
  width:180px;height:180px;border-radius:50%;
  border:4px solid #0d6efd;object-fit:cover;
}
.typing{color:#0d6efd;font-weight:600;}
.tech-badges span{
  background:#0d6efd;color:white;
  padding:6px 14px;border-radius:20px;
  margin:4px;font-size:14px;display:inline-block;
}
section{padding:80px 0;}
.contact-box{
  background:var(--card);
  padding:25px;border-radius:15px;
  transition:.3s;
}
.contact-box:hover{transform:translateY(-6px);}
footer{background:#2E3A59;color:white;padding:30px;}
#themeToggle{cursor:pointer;font-size:20px;}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Hayelom</a>
    <div class="d-flex align-items-center">
      <div id="themeToggle" class="me-3"><i class="fas fa-moon"></i></div>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>
        <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <div data-aos="fade-up">
    <img src="hh.jfif" alt="Profile">
    <h1 class="mt-3">👋 <span id="greeting"></span>, I'm Hayelom</h1>

    <h4 class="typing mt-2" id="typing"></h4>

    <div class="tech-badges mt-3">
      <span>Flutter</span><span>React</span><span>NestJS</span>
      <span>Node.js</span><span>MongoDB</span>
    </div>

    <a href="skills.html" class="btn btn-primary mt-4">View Skills</a>
  </div>
</section>

<!-- Contact -->
<section id="contact" class="container text-center" data-aos="fade-up">
  <h2 class="fw-bold mb-5">Contact Me</h2>
  <div class="row g-4">
    <div class="col-md-4">
      <div class="contact-box">
        <i class="fab fa-telegram text-primary fs-3"></i>
        <h6>Telegram</h6>
      </div>
    </div>
    <div class="col-md-4">
      <div class="contact-box">
        <i class="fab fa-whatsapp text-success fs-3"></i>
        <h6>WhatsApp</h6>
      </div>
    </div>
    <div class="col-md-4">
      <div class="contact-box">
        <i class="fas fa-envelope text-danger fs-3"></i>
        <h6>Email</h6>
      </div>
    </div>
  </div>
</section>

<footer class="text-center">
  © 2025 Hayelom Hailay Tsadik
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

<script>
AOS.init({duration:1000,once:true});

/* Greeting */
const h=new Date().getHours();
document.getElementById("greeting").innerText=
h<12?"Good Morning":h<17?"Good Afternoon":"Good Evening";

/* Typing animation */
const texts=[
 "Full Stack Developer",
 "System Designer",
 "Problem Solver",
 "Project Manager"
];
let i=0,j=0,del=false;
const typing=document.getElementById("typing");
setInterval(()=>{
 if(!del && j<=texts[i].length){
   typing.innerText=texts[i].slice(0,j++);
 }
 else if(del && j>=0){
   typing.innerText=texts[i].slice(0,j--);
 }
 if(j===texts[i].length) del=true;
 if(j===0 && del){ del=false; i=(i+1)%texts.length; }
},120);

/* Dark mode with save */
const toggle=document.getElementById("themeToggle");
if(localStorage.getItem("theme")==="dark"){
 document.body.classList.add("dark-mode");
}
toggle.onclick=()=>{
 document.body.classList.toggle("dark-mode");
 localStorage.setItem("theme",
 document.body.classList.contains("dark-mode")?"dark":"light");
};
</script>

</body>
</html>
