<style>
/* =====================
   THEME VARIABLES
===================== */
:root{
  --bg:#f9fafc;
  --bg-alt:#ffffff;
  --text:#2E3A59;
  --muted:#6c757d;
  --card:#ffffff;
  --primary:#0d6efd;
}
.dark-mode{
  --bg:#121212;
  --bg-alt:#1a1a1a;
  --text:#f1f1f1;
  --muted:#bbbbbb;
  --card:#1e1e1e;
  --primary:#4dabf7;
}

/* =====================
   GLOBAL
===================== */
body{
  font-family:'Poppins',sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.3s ease;
}
section{padding:80px 0;}
a{text-decoration:none;color:inherit;}

/* =====================
   NAVBAR
===================== */
nav{
  background:var(--bg-alt);
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.nav-link{
  color:var(--text) !important;
  font-weight:500;
  position:relative;
}
.nav-link::after{
  content:'';
  position:absolute;
  width:0;
  height:2px;
  background:var(--primary);
  left:0;
  bottom:-4px;
  transition:.3s;
}
.nav-link:hover::after{width:100%;}
#themeToggle{
  cursor:pointer;
  font-size:20px;
  color:var(--text);
}

/* =====================
   HERO
===================== */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(to right,#e3f2fd,var(--bg-alt));
}
.hero img{
  width:180px;
  height:180px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid var(--primary);
}
.typing{
  color:var(--primary);
  font-weight:600;
}
.tech-badges span{
  background:var(--primary);
  color:white;
  padding:6px 14px;
  border-radius:20px;
  margin:4px;
  font-size:14px;
  display:inline-block;
}

/* =====================
   CARDS & CONTACT
===================== */
.contact-box{
  background:var(--card);
  padding:25px;
  border-radius:15px;
  transition:.3s;
  cursor:pointer;
}
.contact-box:hover{
  transform:translateY(-6px);
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}
.contact-box i{
  font-size:32px;
  margin-bottom:10px;
  color:var(--primary);
}
.contact-box h6{
  color:var(--text);
}

/* =====================
   FOOTER
===================== */
footer{
  background:#2E3A59;
  color:white;
  padding:30px 0;
}
.footer-links a{
  color:white;
  font-size:22px;
  margin:0 12px;
  transition:.3s;
}
.footer-links a:hover{
  color:var(--primary);
  transform:scale(1.2);
}
</style>
</head>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

<script>
AOS.init({duration:1000,once:true});

/* Greeting */
const h=new Date().getHours();
document.getElementById("greeting").innerText=
h<12?"Good Morning":h<17?"Good Afternoon":"Good Evening";

/* Typing effect */
const texts=["Full Stack Developer","System Designer","Problem Solver","Project Manager"];
let i=0,j=0,del=false;
const typing=document.getElementById("typing");
setInterval(()=>{
  if(!del && j<=texts[i].length) typing.innerText=texts[i].slice(0,j++);
  else if(del && j>=0) typing.innerText=texts[i].slice(0,j--);
  if(j===texts[i].length) del=true;
  if(j===0 && del){ del=false; i=(i+1)%texts.length; }
},120);

/* Theme persistence */
if(localStorage.getItem("theme")==="dark"){
  document.body.classList.add("dark-mode");
}
document.getElementById("themeToggle").onclick=()=>{
  document.body.classList.toggle("dark-mode");
  localStorage.setItem("theme",
    document.body.classList.contains("dark-mode")?"dark":"light");
};
</script>
