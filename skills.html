<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills | Hayelom</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{--bg:#f9fafc;--text:#2E3A59;--card:#fff;}
.dark-mode{--bg:#121212;--text:#f1f1f1;--card:#1e1e1e;}
body{font-family:'Poppins';background:var(--bg);color:var(--text);}
.skill-card{
  background:var(--card);
  padding:25px;border-radius:15px;
  transition:.3s;
}
.skill-card:hover{transform:translateY(-6px);}
</style>
</head>

<body>

<nav class="navbar navbar-light bg-light">
  <div class="container">
    <a href="index.html" class="navbar-brand">← Back Home</a>
  </div>
</nav>

<section class="container text-center">
  <h2 class="fw-bold mb-5">Skills & Expertise</h2>

  <div class="row g-4">
    <div class="col-md-4">
      <div class="skill-card">
        <i class="fas fa-code fs-2 text-primary"></i>
        <h5 class="mt-3">Frontend</h5>
        <p>HTML, CSS, Bootstrap, React, Flutter</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="skill-card">
        <i class="fas fa-server fs-2 text-success"></i>
        <h5 class="mt-3">Backend</h5>
        <p>Node.js, NestJS, MongoDB</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="skill-card">
        <i class="fas fa-shield-alt fs-2 text-danger"></i>
        <h5 class="mt-3">Networking & Security</h5>
        <p>Cisco CCNA, Cybersecurity</p>
      </div>
    </div>
  </div>
</section>

<script>
if(localStorage.getItem("theme")==="dark"){
 document.body.classList.add("dark-mode");
}
</script>

</body>
</html>
